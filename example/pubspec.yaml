name: flutter_spine_example
description: "End-to-end demo of flutter_spine (Effect bus / VM base / Scaffold series / lint / test toolkit)."
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.5.3
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  flutter_spine: ^0.1.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  custom_lint: ^0.7.0

flutter:
  uses-material-design: true
